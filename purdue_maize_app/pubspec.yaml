name: purdue_maize_app
description: Maize disease monitoring app — Purdue University
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.2.0

  # Secure storage (JWT token persistence)
  flutter_secure_storage: ^9.2.2

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Networking
  dio: ^5.7.0
  retrofit: ^4.1.0

  # Local database (offline-first)
  drift: ^2.20.3
  drift_sqflite: ^2.2.1
  sqflite: ^2.3.3+1

  # Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Location/GPS
  geolocator: ^13.0.1
  permission_handler: ^11.3.1

  # Media capture
  image_picker: ^1.1.2
  record: ^5.1.2                  # Audio recording
  just_audio: ^0.9.40             # Audio playback
  flutter_sound: ^9.2.13          # Alternative audio (encoding support)

  # File / storage
  path_provider: ^2.1.4
  path: ^1.9.0

  # Charts
  fl_chart: ^0.69.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.2
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  connectivity_plus: ^6.0.5       # Detectar conexión para sincronización

  # UI extras
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  retrofit_generator: ^8.1.0
  drift_dev: ^2.20.3
  injectable_generator: ^2.6.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: PurdueSans
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
